<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacBooks Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0f172a;
      --bg-darker: #030712;
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-400: #94a3b8;
      --slate-300: #cbd5e1;
      --slate-50: #f8fafc;
      --cyan-400: #06b6d4;
      --cyan-300: #22d3ee;
      --red-400: #f87171;
    }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background-color: var(--bg-dark);
      color: var(--slate-50);
      line-height: 1.5;
      font-size: 14px;
    }

    .header {
      border-bottom: 1px solid rgba(6, 182, 212, 0.3);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-content {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header-title h1 {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 0.1em;
      color: var(--cyan-400);
    }

    .badge {
      font-size: 10px;
      background: rgba(6, 182, 212, 0.2);
      color: var(--cyan-300);
      padding: 0.25rem 0.5rem;
      border: 1px solid rgba(6, 182, 212, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .button-group {
      display: flex;
      gap: 0.5rem;
    }

    button {
      padding: 0.5rem 1rem;
      border: 1px solid;
      background: transparent;
      color: var(--slate-300);
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      border-color: var(--cyan-400);
      color: var(--cyan-300);
      background: rgba(6, 182, 212, 0.1);
    }

    .btn-primary:hover:not(:disabled) {
      background: rgba(6, 182, 212, 0.2);
    }

    .btn-secondary {
      border-color: var(--slate-700);
      color: var(--slate-300);
      background: transparent;
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--slate-800);
    }

    .filters {
      border-bottom: 1px solid var(--slate-800);
      background: rgba(15, 23, 42, 0.5);
      padding: 1rem;
    }

    .filters-content {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .filter-group {
      flex: 1;
      min-width: 200px;
    }

    .filter-label {
      display: block;
      font-size: 11px;
      color: var(--slate-400);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"],
    input[type="range"] {
      width: 100%;
      padding: 0.5rem;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid var(--slate-700);
      color: var(--slate-50);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--cyan-400);
      background: rgba(30, 41, 59, 0.8);
    }

    input[type="range"] {
      accent-color: var(--cyan-400);
    }

    .content {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .loading,
    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      color: var(--slate-400);
    }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid var(--slate-700);
      border-top-color: var(--cyan-400);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 0.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .listing {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--slate-800);
      margin-bottom: 0.75rem;
      transition: all 0.2s;
      align-items: flex-start;
    }

    .listing:hover {
      border-color: rgba(6, 182, 212, 0.5);
      background: rgba(15, 23, 42, 0.8);
    }

    .listing-index {
      font-size: 18px;
      font-weight: bold;
      color: var(--slate-700);
      min-width: 32px;
      text-align: right;
      flex-shrink: 0;
    }

    .listing:hover .listing-index {
      color: var(--cyan-400);
    }

    .listing-content {
      flex: 1;
      min-width: 0;
    }

    .listing-title {
      color: var(--cyan-300);
      text-decoration: none;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .listing-title:hover {
      text-decoration: underline;
    }

    .listing-meta {
      display: flex;
      gap: 1.5rem;
      font-size: 12px;
      color: var(--slate-400);
    }

    .listing-price {
      text-align: right;
      min-width: 80px;
      flex-shrink: 0;
    }

    .listing-price-value {
      font-size: 18px;
      font-weight: bold;
      color: var(--cyan-400);
    }

    .listing-delete {
      padding: 0.5rem;
      color: var(--slate-600);
      border: none;
      background: transparent;
      cursor: pointer;
      transition: color 0.2s;
    }

    .listing-delete:hover {
      color: var(--red-400);
    }

    .error-box {
      display: flex;
      gap: 0.75rem;
      background: rgba(127, 29, 29, 0.3);
      border: 1px solid rgba(244, 63, 94, 0.5);
      padding: 1rem;
      margin-bottom: 1rem;
      color: #fca5a5;
      font-size: 12px;
    }

    .footer {
      border-top: 1px solid var(--slate-800);
      padding: 2rem 1rem;
      text-align: center;
      color: var(--slate-500);
      font-size: 11px;
    }

    @media (max-width: 640px) {
      .header-content {
        flex-direction: column;
        align-items: flex-start;
      }

      button {
        flex: 1;
      }

      .filters-content {
        flex-direction: column;
        gap: 1rem;
      }

      .listing {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-content">
      <div class="header-title">
        <h1>⚡ MACBOOKS</h1>
        <span class="badge" id="countBadge">0 RÉSULTATS</span>
      </div>
      <div class="button-group">
        <button id="scrapeBtn" class="btn-primary" onclick="triggerScrape()">
          SCRAPER
        </button>
        <button id="exportBtn" class="btn-secondary" onclick="exportData()" disabled>
          EXPORT JSON
        </button>
      </div>
    </div>
  </div>

  <div class="filters">
    <div class="filters-content">
      <div class="filter-group">
        <label class="filter-label">Recherche</label>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="MacBook Air, Pro, M2..." 
          onkeyup="filterListings()"
        >
      </div>
      <div class="filter-group">
        <label class="filter-label">
          Prix max: <span id="priceValue">5000</span>€
        </label>
        <input 
          type="range" 
          id="priceRange" 
          min="0" 
          max="5000" 
          value="5000" 
          onchange="filterListings()"
        >
      </div>
    </div>
  </div>

  <div class="content">
    <div id="errorBox" class="error-box" style="display: none;">
      <span>⚠️</span>
      <span id="errorText"></span>
    </div>

    <div id="listings" class="listings"></div>
  </div>

  <div class="footer">
    <p>Dashboard MacBooks Le Bon Coin | CloakBrowser 🔒 | buildermotionl</p>
  </div>

  <script>
    // CONFIGURATION - À REMPLACER
    const SUPABASE_URL = 'https://rrgkqpjtmurcbvdxrexo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_z1rX7xRf8UUqhjHeEWRcwg_VCeiUXbY';

    let supabase;
    let allListings = [];
    let filteredListings = [];

    function initSupabase() {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    async function loadListings() {
      try {
        const { data, error } = await supabase
          .from('macbooks_listings')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        allListings = data || [];
        filterListings();
        document.getElementById('exportBtn').disabled = allListings.length === 0;
      } catch (err) {
        showError(`Erreur chargement: ${err.message}`);
      }
    }

    function filterListings() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const maxPrice = parseInt(document.getElementById('priceRange').value);
      document.getElementById('priceValue').textContent = maxPrice.toLocaleString();

      filteredListings = allListings.filter(item => {
        const price = parseInt(item.prix?.replace(/[^\d]/g, '') || '0');
        const matchesSearch = item.titre?.toLowerCase().includes(searchTerm);
        const matchesPrice = price <= maxPrice;
        return matchesSearch && matchesPrice;
      });

      renderListings();
      updateBadge();
    }

    function renderListings() {
      const container = document.getElementById('listings');

      if (filteredListings.length === 0) {
        container.innerHTML = '<div class="empty">Aucun résultat trouvé</div>';
        return;
      }

      container.innerHTML = filteredListings.map((item, idx) => `
        <div class="listing">
          <div class="listing-index">${String(idx + 1).padStart(2, '0')}</div>
          <div class="listing-content">
            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="listing-title">
              ${item.titre}
            </a>
            <div class="listing-meta">
              <span>📍 ${item.localisation}</span>
              <span>⏰ ${new Date(item.created_at).toLocaleDateString('fr-FR')}</span>
            </div>
          </div>
          <div class="listing-price">
            <div class="listing-price-value">${item.prix}</div>
          </div>
          <button class="listing-delete" onclick="deleteListing('${item.id}')" title="Supprimer">✕</button>
        </div>
      `).join('');
    }

    function updateBadge() {
      document.getElementById('countBadge').textContent = 
        `${filteredListings.length} RÉSULTATS`;
    }

    async function triggerScrape() {
      const btn = document.getElementById('scrapeBtn');
      btn.disabled = true;
      btn.textContent = '⏳ SCRAPING...';

      try {
        // Pour maintenant: simule des données
        const mockListings = [
          {
            titre: 'MacBook Air M2 2023 - Excellent état',
            prix: '899€',
            localisation: 'Paris (75)',
            url: 'https://www.leboncoin.fr',
            source: 'leboncoin'
          },
          {
            titre: 'MacBook Pro 14" M3 Max - Neuf',
            prix: '1899€',
            localisation: 'Lyon (69)',
            url: 'https://www.leboncoin.fr',
            source: 'leboncoin'
          },
          {
            titre: 'MacBook Air 13" M1 - 2021',
            prix: '699€',
            localisation: 'Marseille (13)',
            url: 'https://www.leboncoin.fr',
            source: 'leboncoin'
          }
        ];

        // Insérer les données
        const { error } = await supabase
          .from('macbooks_listings')
          .insert(mockListings);

        if (error && !error.message.includes('duplicate')) {
          throw error;
        }

        await new Promise(resolve => setTimeout(resolve, 1000));
        await loadListings();
        hideError();
      } catch (err) {
        showError(`Erreur scrape: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = 'SCRAPER';
      }
    }

    async function deleteListing(id) {
      try {
        const { error } = await supabase
          .from('macbooks_listings')
          .delete()
          .eq('id', id);

        if (error) throw error;
        
        allListings = allListings.filter(l => l.id !== id);
        filterListings();
      } catch (err) {
        showError(`Erreur suppression: ${err.message}`);
      }
    }

    function exportData() {
      const json = JSON.stringify(filteredListings, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `macbooks_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      document.getElementById('errorText').textContent = msg;
      box.style.display = 'flex';
    }

    function hideError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    window.addEventListener('load', () => {
      initSupabase();
      loadListings();
    });
  </script>
</body>
</html>
