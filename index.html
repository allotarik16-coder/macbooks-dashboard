<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BulkDirect - Reddit Intelligence Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'IBM Plex Mono', monospace;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1280px;
            width: 100%;
        }

        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 1.5rem;
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        header h1 span {
            color: #38bdf8;
        }

        header p {
            color: #64748b;
            font-size: 14px;
            margin-top: 0.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .filter-btn {
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: #38bdf8;
            color: #f8fafc;
        }

        .filter-btn.active {
            background-color: transparent;
            border-color: #38bdf8;
            color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .error-box {
            display: none;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 2rem;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            color: #64748b;
            padding: 2rem;
            font-size: 16px;
        }

        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .post-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1.2rem;
            transition: border-color 0.2s ease;
        }

        .post-card:hover {
            border-color: rgba(56, 189, 248, 0.5);
        }

        .post-title {
            font-size: 16px;
            font-weight: 500;
            color: #f8fafc;
            margin-bottom: 0.8rem;
            line-height: 1.4;
        }

        .post-meta {
            display: flex;
            gap: 1.5rem;
            font-size: 12px;
            color: #64748b;
        }

        .post-meta span strong {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>BULK<span>DIRECT</span></h1>
            <p>Reddit Intelligence Dashboard</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="stat-posts">-</div>
                <div class="stat-label">Total Posts</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-upvotes">-</div>
                <div class="stat-label">Avg Upvotes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-comments">-</div>
                <div class="stat-label">Avg Comments</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-engagement">-</div>
                <div class="stat-label">Top Engagement</div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="changeSubreddit('all', this)">All Subreddits</button>
            <button class="filter-btn" onclick="changeSubreddit('dropshipping', this)">Dropshipping</button>
            <button class="filter-btn" onclick="changeSubreddit('ecommerce', this)">E-commerce</button>
            <button class="filter-btn" onclick="changeSubreddit('saas', this)">SaaS</button>
            <button class="filter-btn" onclick="changeSubreddit('entrepreneur', this)">Entrepreneur</button>
        </div>

        <div class="error-box" id="error-message"></div>
        <div class="loading" id="loading-indicator" style="display: none;">Chargement des données Reddit...</div>
        <div class="posts-list" id="posts-container"></div>
    </div>

    <script>
        async function fetchRedditData(subreddit = 'all') {
            const container = document.getElementById('posts-container');
            const errorBox = document.getElementById('error-message');
            const loader = document.getElementById('loading-indicator');

            errorBox.style.display = 'none';
            container.innerHTML = '';
            loader.style.display = 'block';
            resetStats();

            let url = 'https://www.reddit.com/r/all/hot.json?limit=30';
            if (subreddit !== 'all') {
                url = `https://www.reddit.com/r/${subreddit}/hot.json?limit=30`;
            }

            try {
                // Ajout des en-têtes d'identification requis par Reddit pour contrer le code 429
                const response = await fetch(url, {
                    headers: {
                        'User-Agent': 'v2:bulkdirect.dashboard:v1.0.0 (by /u/allotarik16)'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`Code HTTP ${response.status}`);
                }

                const resData = await response.json();
                const posts = resData.data.children;

                if (!posts || posts.length === 0) {
                    throw new Error("Aucun post trouvé.");
                }

                loader.style.display = 'none';
                calculateStats(posts);
                renderPostsList(posts);

            } catch (error) {
                loader.style.display = 'none';
                errorBox.textContent = `Erreur de chargement : ${error.message}.`;
                errorBox.style.display = 'block';
                console.error("Détails de l'erreur :", error);
            }
        }

        function calculateStats(posts) {
            const total = posts.length;
            let sumUpvotes = 0;
            let sumComments = 0;
            let maxEngagement = 0;

            posts.forEach(item => {
                const p = item.data;
                sumUpvotes += p.ups || 0;
                sumComments += p.num_comments || 0;

                let engagement = (p.ups || 0) + (p.num_comments || 0);
                if (engagement > maxEngagement) {
                    maxEngagement = engagement;
                }
            });

            document.getElementById('stat-posts').textContent = total;
            document.getElementById('stat-upvotes').textContent = total > 0 ? Math.round(sumUpvotes / total) : 0;
            document.getElementById('stat-comments').textContent = total > 0 ? Math.round(sumComments / total) : 0;
            document.getElementById('stat-engagement').textContent = maxEngagement;
        }

        function renderPostsList(posts) {
            const container = document.getElementById('posts-container');
            
            posts.forEach(item => {
                const p = item.data;
                const card = document.createElement('div');
                card.className = 'post-card';
                
                card.innerHTML = `
                    <div class="post-title">${p.title}</div>
                    <div class="post-meta">
                        <span>Subreddit: <strong>r/${p.subreddit}</strong></span>
                        <span>Upvotes: <strong>${p.ups}</strong></span>
                        <span>Comments: <strong>${p.num_comments}</strong></span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function changeSubreddit(subName, element) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            fetchRedditData(subName);
        }

        function resetStats() {
            document.getElementById('stat-posts').textContent = '-';
            document.getElementById('stat-upvotes').textContent = '-';
            document.getElementById('stat-comments').textContent = '-';
            document.getElementById('stat-engagement').textContent = '-';
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchRedditData('all');
        });
    </script>
</body>
</html>
