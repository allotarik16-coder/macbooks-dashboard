<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BulkDirect Projet III - Intelligence Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'IBM Plex Mono', monospace; }
        body { background-color: #0b0f19; color: #f1f5f9; padding: 2rem 1rem; display: flex; justify-content: center; }
        .container { max-width: 1200px; width: 100%; }
        header { margin-bottom: 2.5rem; border-bottom: 2px dashed #1e293b; padding-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1rem; }
        header h1 { font-size: 28px; font-weight: 700; letter-spacing: 2px; color: #f8fafc; text-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        header h1 span { color: #38bdf8; }
        header p { color: #64748b; font-size: 13px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; margin-bottom: 2.5rem; }
        .stat-card { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; text-align: center; }
        .stat-number { font-size: 32px; font-weight: 700; color: #38bdf8; margin-bottom: 0.5rem; }
        .stat-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
        .dashboard-meta-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; margin-bottom: 2.5rem; }
        @media (max-width: 900px) { .dashboard-meta-grid { grid-template-columns: 1fr; } }
        .visual-box, .insight-box { background-color: #111827; border: 1px solid #1e293b; border-radius: 12px; padding: 1.5rem; min-height: 280px; }
        .box-title { font-size: 14px; color: #94a3b8; text-transform: uppercase; margin-bottom: 1rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.5rem; }
        .insight-content { font-size: 13px; color: #cbd5e1; line-height: 1.6; }
        .controls-row { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .search-box { flex: 1; }
        .search-box input { width: 100%; background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 0.8rem 1.2rem; border-radius: 8px; outline: none; font-size: 14px; }
        .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2.5rem; }
        .filter-btn { background-color: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .filter-btn.active { background-color: transparent; border-color: #38bdf8; color: #38bdf8; }
        .posts-list { display: flex; flex-direction: column; gap: 1rem; }
        .post-card { background-color: #111827; border: 1px solid #1e293b; border-left: 4px solid #334155; border-radius: 8px; padding: 1.2rem; text-decoration: none; display: block; margin-bottom: 0.5rem; }
        .post-title { font-size: 15px; color: #f8fafc; margin-bottom: 0.8rem; font-weight: 500; }
        .post-meta { display: flex; gap: 1.5rem; font-size: 12px; color: #64748b; }
        .post-meta strong { color: #38bdf8; }
        .loading { text-align: center; color: #38bdf8; padding: 2rem; border: 1px dashed #334155; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>BULK<span>DIRECT PROJET III</span></h1>
                <p>Intelligence Hub & Predictive Analytics</p>
            </div>
            <div id="active-sub-display" style="font-size:12px; color:#38bdf8; border:1px solid #38bdf8; padding:4px 8px; border-radius:4px;">r/all</div>
        </header>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="stat-posts">-</div><div class="stat-label">Analysed Posts</div></div>
            <div class="stat-card"><div class="stat-number" id="stat-upvotes">-</div><div class="stat-label">Avg Upvotes</div></div>
            <div class="stat-card"><div class="stat-number" id="stat-comments">-</div><div class="stat-label">Avg Comments</div></div>
            <div class="stat-card"><div class="stat-number" id="stat-engagement">-</div><div class="stat-label">Max Engagement</div></div>
        </div>

        <div class="dashboard-meta-grid">
            <div class="visual-box">
                <div class="box-title">📊 Engagement Trend (Top 8)</div>
                <div style="position: relative; height:200px; width:100%;">
                    <canvas id="engagementChart"></canvas>
                </div>
            </div>
            <div class="insight-box">
                <div class="box-title">💡 Market Intelligence</div>
                <div class="insight-content" id="insight-text">Initialisation...</div>
            </div>
        </div>

        <div class="controls-row">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 Scanner un Subreddit (ex: saas, dropshipping)..." onkeypress="handleSearch(event)">
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="changeSubreddit('all', this)">All Subreddits</button>
            <button class="filter-btn" onclick="changeSubreddit('dropshipping', this)">Dropshipping</button>
            <button class="filter-btn" onclick="changeSubreddit('ecommerce', this)">E-commerce</button>
            <button class="filter-btn" onclick="changeSubreddit('saas', this)">SaaS</button>
        </div>

        <div class="loading" id="loading-indicator">Téléchargement des données en cours...</div>
        <div class="posts-list" id="posts-container"></div>
    </div>

    <script>
        let currentPostsGlobal = [];
        let chartInstance = null;

        // Utilisation du format natif JSONP de Reddit pour contourner les blocages CORS de manière fluide
        function fetchRedditData(subreddit = 'all') {
            const container = document.getElementById('posts-container');
            const loader = document.getElementById('loading-indicator');
            document.getElementById('active-sub-display').textContent = `r/${subreddit}`;
            container.innerHTML = '';
            loader.style.display = 'block';

            // Supprime l'ancien script temporaire s'il existe
            const oldScript = document.getElementById('reddit-jsonp');
            if (oldScript) oldScript.remove();

            // Crée un nouvel appel script direct vers Reddit
            const script = document.createElement('script');
            script.id = 'reddit-jsonp';
            script.src = `https://www.reddit.com/r/${subreddit}/hot.json?limit=25&jsonp=redditCallback`;
            
            script.onerror = function() {
                loader.style.display = 'none';
                container.innerHTML = '<div style="color:#ef4444;text-align:center;padding:1rem;">Erreur réseau de l\'API Reddit. Réessayez.</div>';
            };

            document.body.appendChild(script);
        }

        // Fonction globale appelée automatiquement dès que Reddit renvoie les données
        window.redditCallback = function(resData) {
            document.getElementById('loading-indicator').style.display = 'none';
            if (resData && resData.data && resData.data.children) {
                currentPostsGlobal = resData.data.children;
                applyProcess(document.getElementById('active-sub-display').textContent.replace('r/', ''));
            }
        };

        function applyProcess(subreddit) {
            let postsToRender = [...currentPostsGlobal];
            calculateStats(postsToRender);
            renderPostsList(postsToRender);
            updateChart(postsToRender);
            generateInsights(subreddit);
        }

        function calculateStats(posts) {
            const total = posts.length;
            let sumUpvotes = 0, sumComments = 0, maxEngagement = 0;
            
            posts.forEach(item => {
                sumUpvotes += item.data.ups || 0;
                sumComments += item.data.num_comments || 0;
                let eng = (item.data.ups || 0) + (item.data.num_comments || 0);
                if (eng > maxEngagement) maxEngagement = eng;
            });
            
            document.getElementById('stat-posts').textContent = total;
            document.getElementById('stat-upvotes').textContent = total > 0 ? Math.round(sumUpvotes / total) : 0;
            document.getElementById('stat-comments').textContent = total > 0 ? Math.round(sumComments / total) : 0;
            document.getElementById('stat-engagement').textContent = maxEngagement;
        }

        function renderPostsList(posts) {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            posts.forEach(item => {
                const p = item.data;
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-title">${p.title}</div>
                    <div class="post-meta">
                        <span>r/${p.subreddit}</span>
                        <span>Upvotes: <strong>${p.ups}</strong></span>
                        <span>Comments: <strong>${p.num_comments}</strong></span>
                    </div>`;
                container.appendChild(card);
            });
        }

        function updateChart(posts) {
            const canvas = document.getElementById('engagementChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const topFive = posts.slice(0, 8);
            
            if (chartInstance) chartInstance.destroy();
            
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: topFive.map((_, i) => `#${i+1}`),
                    datasets: [
                        { 
                            label: 'Upvotes', 
                            data: topFive.map(p => p.data.ups || 0), 
                            borderColor: '#38bdf8', 
                            backgroundColor: 'rgba(56, 189, 248, 0.05)', 
                            borderWidth: 3,
                            tension: 0.4,
                            fill: true
                        },
                        { 
                            label: 'Comments', 
                            data: topFive.map(p => p.data.num_comments || 0), 
                            borderColor: '#a855f7', 
                            backgroundColor: 'rgba(168, 85, 247, 0.05)', 
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true,
                            borderDash: [5, 5]
                        }
                    ]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#94a3b8', font: { family: 'IBM Plex Mono', size: 10 } } } },
                    scales: {
                        x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { family: 'IBM Plex Mono', size: 10 } } },
                        y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { family: 'IBM Plex Mono', size: 10 } } }
                    }
                }
            });
        }

        function generateInsights(subreddit) {
            const txt = document.getElementById('insight-text');
            if (subreddit === 'dropshipping' || subreddit === 'ecommerce') {
                txt.textContent = "Signaux d'acquisition en hausse. Focus communautaire sur l'optimisation des tunnels de conversion logistiques.";
            } else if (subreddit === 'saas') {
                txt.textContent = "Forte activité sur les architectures légères (Micro-SaaS). Volatilité moyenne constatée sur l'engagement.";
            } else {
                txt.textContent = "Analyse globale terminée. Les volumes d'engagement réseau suivent une courbe de distribution standard.";
            }
        }

        function handleSearch(event) {
            if (event.key === 'Enter') {
                const query = document.getElementById('search-input').value.trim().toLowerCase();
                if (query) {
                    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                    fetchRedditData(query);
                }
            }
        }

        function changeSubreddit(subName, element) {
            document.getElementById('search-input').value = '';
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            fetchRedditData(subName);
        }

        document.addEventListener('DOMContentLoaded', () => { fetchRedditData('all'); });
    </script>
</body>
</html>
