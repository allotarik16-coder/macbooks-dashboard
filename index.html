<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BulkDirect III - Intelligence Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'IBM Plex Mono', monospace;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        header {
            margin-bottom: 2.5rem;
            border-bottom: 2px dashed #1e293b;
            padding-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 1rem;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #f8fafc;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        header h1 span {
            color: #38bdf8;
        }

        header p {
            color: #64748b;
            font-size: 13px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            transition: border-color 0.3s;
        }

        .stat-card:hover {
            border-color: #38bdf8;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .stat-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Analytics Workspace */
        .dashboard-meta-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        @media (max-width: 900px) {
            .dashboard-meta-grid {
                grid-template-columns: 1fr;
            }
        }

        .visual-box, .insight-box {
            background-color: #111827;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 1.5rem;
        }

        .box-title {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 0.5rem;
        }

        .insight-content {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .insight-tags {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .tag {
            font-size: 10px;
            background-color: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        /* Inputs & Controls */
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .search-box {
            flex: 1;
            min-width: 280px;
        }

        .search-box input {
            width: 100%;
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
        }

        .sort-box select {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2.5rem;
        }

        .filter-btn {
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: #38bdf8;
            color: #f8fafc;
        }

        .filter-btn.active {
            background-color: transparent;
            border-color: #38bdf8;
            color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
        }

        /* Stream Cards */
        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .post-card {
            background-color: #111827;
            border: 1px solid #1e293b;
            border-left: 4px solid #334155;
            border-radius: 8px;
            padding: 1.2rem;
            text-decoration: none;
            display: block;
            transition: all 0.2s ease;
        }

        .post-card:hover {
            border-color: #38bdf8;
            border-left-color: #38bdf8;
            transform: translateX(4px);
            background-color: #1e293b;
        }

        .post-title {
            font-size: 15px;
            font-weight: 500;
            color: #f8fafc;
            margin-bottom: 0.8rem;
            line-height: 1.5;
        }

        .post-meta {
            display: flex;
            gap: 1.5rem;
            font-size: 12px;
            color: #64748b;
            flex-wrap: wrap;
        }

        .post-meta span strong {
            color: #38bdf8;
        }

        .error-box {
            display: none;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .loading {
            text-align: center;
            color: #38bdf8;
            padding: 2rem;
            font-size: 14px;
            border: 1px dashed #334155;
            border-radius: 8px;
            background-color: #111827;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>BULK<span>DIRECT III</span></h1>
                <p>Intelligence Hub & Predictive Analytics</p>
            </div>
            <div id="active-sub-display" style="font-size:12px; color:#38bdf8; border:1px solid #38bdf8; padding:4px 8px; border-radius:4px;">r/all</div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="stat-posts">-</div>
                <div class="stat-label">Analysed Posts</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-upvotes">-</div>
                <div class="stat-label">Avg Upvotes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-comments">-</div>
                <div class="stat-label">Avg Comments</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-engagement">-</div>
                <div class="stat-label">Max Engagement</div>
            </div>
        </div>

        <div class="dashboard-meta-grid">
            <div class="visual-box">
                <div class="box-title">📊 Metrics Distribution (Top Posts)</div>
                <div style="position: relative; height:200px; width:100%;">
                    <canvas id="engagementChart"></canvas>
                </div>
            </div>
            <div class="insight-box">
                <div class="box-title">💡 Market Intelligence</div>
                <div class="insight-content" id="insight-text">
                    Collecte des paquets de données en cours...
                </div>
                <div class="insight-tags" id="insight-tags">
                    <span class="tag">#CoreEngaged</span>
                </div>
            </div>
        </div>

        <div class="controls-row">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 Scanner un Subreddit ciblé (ex: saas, dropshipping, tech)..." onkeypress="handleSearch(event)">
            </div>
            <div class="sort-box">
                <select id="sort-select" onchange="handleSortChange()">
                    <option value="default">Algorithme : Hot</option>
                    <option value="upvotes">Tri : Densité d'Upvotes 📈</option>
                    <option value="comments">Tri : Taux de Discussion 💬</option>
                </select>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="changeSubreddit('all', this)">All Subreddits</button>
            <button class="filter-btn" onclick="changeSubreddit('dropshipping', this)">Dropshipping</button>
            <button class="filter-btn" onclick="changeSubreddit('ecommerce', this)">E-commerce</button>
            <button class="filter-btn" onclick="changeSubreddit('saas', this)">SaaS</button>
            <button class="filter-btn" onclick="changeSubreddit('entrepreneur', this)">Entrepreneur</button>
        </div>

        <div class="error-box" id="error-message"></div>
        <div class="loading" id="loading-indicator">Synchronisation avec les API Reddit...</div>
        <div class="posts-list" id="posts-container"></div>
    </div>

    <script>
        let currentPostsGlobal = [];
        let chartInstance = null;

        async function fetchRedditData(subreddit = 'all') {
            const container = document.getElementById('posts-container');
            const errorBox = document.getElementById('error-message');
            const loader = document.getElementById('loading-indicator');
            document.getElementById('active-sub-display').textContent = `r/${subreddit}`;

            errorBox.style.display = 'none';
            container.innerHTML = '';
            loader.style.display = 'block';
            resetStats();

            let url = 'https://www.reddit.com/r/all/hot.json?limit=25';
            if (subreddit !== 'all') {
                url = `https://www.reddit.com/r/${subreddit}/hot.json?limit=25`;
            }

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const resData = await response.json();
                currentPostsGlobal = resData.data.children;
                loader.style.display = 'none';
                applyProcess(subreddit);
            } catch (error) {
                try {
                    const fallbackUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                    const response = await fetch(fallbackUrl);
                    if (!response.ok) throw new Error();
                    const resData = await response.json();
                    currentPostsGlobal = resData.data.children;
                    loader.style.display = 'none';
                    applyProcess(subreddit);
                } catch (fallbackError) {
                    loader.style.display = 'none';
                    errorBox.textContent = "Serveur distant inaccessible. Modifiez le nom du Subreddit ou réessayez.";
                    errorBox.style.display = 'block';
                }
            }
        }

        function applyProcess(subreddit) {
            let postsToRender = [...currentPostsGlobal];
            const sortStyle = document.getElementById('sort-select').value;

            if (sortStyle === 'upvotes') {
                postsToRender.sort((a, b) => (b.data.ups || 0) - (a.data.ups || 0));
            } else if (sortStyle === 'comments') {
                postsToRender.sort((a, b) => (b.data.num_comments || 0) - (a.data.num_comments || 0));
            }

            calculateStats(postsToRender);
            renderPostsList(postsToRender);
            updateChart(postsToRender);
            generateInsights(subreddit, postsToRender);
        }

        function calculateStats(posts) {
            const total = posts.length;
            let sumUpvotes = 0;
            let sumComments = 0;
            let maxEngagement = 0;

            posts.forEach(item => {
                const p = item.data;
                sumUpvotes += p.ups || 0;
                sumComments += p.num_comments || 0;
                let engagement = (p.ups || 0) + (p.num_comments || 0);
                if (engagement > maxEngagement) maxEngagement = engagement;
            });

            document.getElementById('stat-posts').textContent = total;
            document.getElementById('stat-upvotes').textContent = total > 0 ? Math.round(sumUpvotes / total) : 0;
            document.getElementById('stat-comments').textContent = total > 0 ? Math.round(sumComments / total) : 0;
            document.getElementById('stat-engagement').textContent = maxEngagement;
        }

        function renderPostsList(posts) {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            
            posts.forEach(item => {
                const p = item.data;
                const card = document.createElement('a');
                card.className = 'post-card';
                card.href = `https://www.reddit.com${p.permalink}`;
                card.target = '_blank';
                
                card.innerHTML = `
                    <div class="post-title">${p.title}</div>
                    <div class="post-meta">
                        <span>Subreddit: <strong>r/${p.subreddit}</strong></span>
                        <span>Upvotes: <strong>${p.ups}</strong></span>
                        <span>Comments: <strong>${p.num_comments}</strong></span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateChart(posts) {
            const ctx = document.getElementById('engagementChart').getContext('2d');
            const topFive = posts.slice(0, 5);
            const labels = topFive.map((_, i) => `P#${i+1}`);
            const upvotesData = topFive.map(item => item.data.ups || 0);
            const commentsData = topFive.map(item => item.data.num_comments || 0);

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Upvotes', data: upvotesData, backgroundColor: '#38bdf8' },
                        { label: 'Comments', data: commentsData, backgroundColor: '#818cf8' }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { family: 'IBM Plex Mono', size: 9 } } },
                        y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { family: 'IBM Plex Mono', size: 9 } } }
                    },
                    plugins: { legend: { labels: { color: '#94a3b8', font: { family: 'IBM Plex Mono', size: 10 } } } }
                }
            });
        }

        function generateInsights(subreddit, posts) {
            const insightText = document.getElementById('insight-text');
            const insightTags = document.getElementById('insight-tags');
            
            if (posts.length === 0) return;

            insightTags.innerHTML = `<span class="tag">#${subreddit.toUpperCase()}</span>`;

            if (subreddit === 'dropshipping' || subreddit === 'ecommerce') {
                insightText.textContent = `Les discussions s'intensifient autour de l'optimisation des tunnels de conversion et des retours clients. Opportunité détectée : le marché manque de clarté sur la fidélisation post-achat.`;
                insightTags.innerHTML += `<span class="tag">#Conversion</span><span class="tag">#Retention</span>`;
            } else if (subreddit === 'saas') {
                insightText.textContent = `Forte corrélation entre simplicité du produit et engagement des utilisateurs. Les micro-SaaS d'automatisation de flux retiennent l'attention des investisseurs ce trimestre.`;
                insightTags.innerHTML += `<span class="tag">#MicroSaaS</span><span class="tag">#Automation</span>`;
            } else {
                insightText.textContent = `La tendance générale s'oriente vers le partage de "Case Studies" réels. Les posts contenant des métriques chiffrées précises génèrent 40% d'engagement en plus.`;
                insightTags.innerHTML += `<span class="tag">#CaseStudies</span>`;
            }
        }

        function handleSearch(event) {
            if (event.key === 'Enter') {
                const query = document.getElementById('search-input').value.trim().toLowerCase();
                if (query) {
                    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                    fetchRedditData(query);
                }
            }
        }

        function handleSortChange() {
            if (currentPostsGlobal.length > 0) {
                const currentSub = document.getElementById('active-sub-display').textContent.replace('r/', '');
                applyProcess(currentSub);
            }
        }

        function changeSubreddit(subName, element) {
            document.getElementById('search-input').value = '';
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            fetchRedditData(subName);
        }

        function resetStats() {
            document.getElementById('stat-posts').textContent = '-';
            document.getElementById('stat-upvotes').textContent = '-';
            document.getElementById('stat-comments').textContent = '-';
            document.getElementById('stat-engagement').textContent = '-';
        }

        document.addEventListener('DOMContentLoaded', () => { fetchRedditData('all'); });
    </script>
</body>
</html>
