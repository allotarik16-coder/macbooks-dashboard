<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BulkDirect III — Intelligence Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Taste Skill Base: No pure black (#000), subtle transitions, high-end layout variance */
        :root {
            --bg-main: #090a0f;
            --bg-card: #12141c;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --text-primary: #f4f4f7;
            --text-secondary: #8e93a6;
            --accent-blue: #2f6fed;
            --accent-purple: #905cf2;
            --font-sans: 'Geist', -apple-system, sans-serif;
            --font-mono: 'Geist Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--bg-main); 
            color: var(--text-primary); 
            font-family: var(--font-sans);
            padding: 3rem 1.5rem; 
            display: flex; 
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 1100px; width: 100%; }

        /* Cinematic Spatial Rhythm Header */
        header { 
            margin-bottom: 4rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            flex-wrap: wrap; 
            gap: 2rem; 
        }
        .header-title h1 { 
            font-size: 24px; 
            font-weight: 600; 
            letter-spacing: -0.03em; 
            color: var(--text-primary);
        }
        .header-title h1 span { font-family: var(--font-mono); font-weight: 400; color: var(--text-secondary); font-size: 18px; margin-left: 0.5rem; }
        .header-title p { color: var(--text-secondary); font-size: 13px; margin-top: 0.4rem; font-weight: 400; }
        
        #active-sub-display { 
            font-family: var(--font-mono);
            font-size: 12px; 
            color: var(--text-primary); 
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle); 
            padding: 6px 14px; 
            border-radius: 100px;
        }

        /* Anti-Card Overuse & Layout Variance: Asymmetrical Structural Flow */
        .main-dashboard-grid {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .metric-sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            justify-content: space-between;
        }

        .visual-box { 
            background: var(--bg-card); 
            border: 1px solid var(--border-subtle); 
            border-radius: 16px; 
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .stat-inline-row {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .stat-inline-row:hover {
            background: rgba(255, 255, 255, 0.03);
            transform: translateY(-2px);
        }
        .stat-label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        .stat-number { font-family: var(--font-mono); font-size: 20px; font-weight: 500; color: var(--text-primary); }

        .box-title { 
            font-size: 12px; 
            color: var(--text-secondary); 
            text-transform: uppercase; 
            letter-spacing: 0.08em;
            margin-bottom: 1.5rem; 
            font-weight: 600;
        }

        /* Search & Filter Modules */
        .search-area { margin-bottom: 2.5rem; }
        .search-box input { 
            width: 100%; 
            background-color: var(--bg-card); 
            border: 1px solid var(--border-subtle); 
            color: var(--text-primary); 
            padding: 1rem 1.5rem; 
            border-radius: 12px; 
            outline: none; 
            font-size: 14px;
            transition: border-color 0.2s ease;
        }
        .search-box input:focus { border-color: rgba(255, 255, 255, 0.2); }

        .filters { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 3rem; }
        .filter-btn { 
            background-color: transparent; 
            color: var(--text-secondary); 
            border: 1px solid var(--border-subtle); 
            padding: 0.6rem 1.2rem; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .filter-btn.active, .filter-btn:hover { 
            background-color: var(--text-primary); 
            color: var(--bg-main); 
            border-color: var(--text-primary);
        }

        /* Premium Content Feed Architecture */
        .section-headline {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .posts-list { display: flex; flex-direction: column; gap: 0.75rem; }
        .post-card { 
            background-color: var(--bg-card); 
            border: 1px solid var(--border-subtle); 
            border-radius: 12px; 
            padding: 1.5rem; 
            display: block; 
            text-decoration: none;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .post-card:hover { 
            background-color: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.12);
        }
        .post-title { font-size: 15px; color: var(--text-primary); margin-bottom: 1rem; line-height: 1.5; font-weight: 500; }
        .post-meta { display: flex; gap: 2rem; font-size: 12px; color: var(--text-secondary); font-family: var(--font-mono); }
        .post-meta span strong { color: var(--text-primary); font-weight: 500; }

        .insight-box {
            margin-top: 1.5rem;
            border-top: 1px solid var(--border-subtle);
            padding-top: 1.5rem;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .loading { text-align: center; color: var(--text-secondary); padding: 3rem; font-family: var(--font-mono); font-size: 13px; }

        @media (max-width: 880px) { 
            .main-dashboard-grid { grid-template-columns: 1fr; } 
            body { padding: 1.5rem 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <h1>BulkDirect<span>III</span></h1>
                <p>High-Fidelity Contextual Reddit Asset Analyzer</p>
            </div>
            <div id="active-sub-display">r/all</div>
        </header>

        <div class="main-dashboard-grid">
            <div class="visual-box">
                <div class="box-title">Analytics Trend Baseline</div>
                <div style="position: relative; height: 260px; width: 100%;">
                    <canvas id="engagementChart"></canvas>
                </div>
            </div>
            
            <div class="metric-sidebar">
                <div class="stat-inline-row">
                    <div class="stat-label">Scanned Data</div>
                    <div class="stat-number" id="stat-posts">-</div>
                </div>
                <div class="stat-inline-row">
                    <div class="stat-label">Mean Distribution</div>
                    <div class="stat-number" id="stat-upvotes">-</div>
                </div>
                <div class="stat-inline-row">
                    <div class="stat-label">Interaction Level</div>
                    <div class="stat-number" id="stat-comments">-</div>
                </div>
                <div class="stat-inline-row">
                    <div class="stat-label">Peak Velocity</div>
                    <div class="stat-number" id="stat-engagement">-</div>
                </div>
            </div>
        </div>

        <div class="search-area">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Query alternate matrix (e.g. saas, indiehackers)..." onkeypress="handleSearch(event)">
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="changeSubreddit('all', this)">All Feeds</button>
            <button class="filter-btn" onclick="changeSubreddit('dropshipping', this)">Dropshipping</button>
            <button class="filter-btn" onclick="changeSubreddit('ecommerce', this)">E-Commerce</button>
            <button class="filter-btn" onclick="changeSubreddit('saas', this)">SaaS</button>
        </div>

        <div class="insight-box" id="insight-text">Synchronizing data stream hooks...</div>

        <div style="margin-top: 3rem;">
            <div class="section-headline">Feed Aggregation</div>
            <div class="loading" id="loading-indicator">Fetching core ledger node...</div>
            <div class="posts-list" id="posts-container"></div>
        </div>
    </div>

    <script>
        let currentPostsGlobal = [];
        let chartInstance = null;

        function fetchRedditData(subreddit = 'all') {
            const container = document.getElementById('posts-container');
            const loader = document.getElementById('loading-indicator');
            document.getElementById('active-sub-display').textContent = `r/${subreddit}`;
            container.innerHTML = '';
            loader.style.display = 'block';

            const oldScript = document.getElementById('reddit-jsonp');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'reddit-jsonp';
            script.src = `https://www.reddit.com/r/${subreddit}/hot.json?limit=16&jsonp=redditCallback`;
            
            script.onerror = function() {
                loader.style.display = 'none';
                container.innerHTML = '<div style="color:var(--text-secondary);text-align:center;font-size:13px;padding:2rem;">Network handshake failed. Retrying sync link.</div>';
            };

            document.body.appendChild(script);
        }

        window.redditCallback = function(resData) {
            document.getElementById('loading-indicator').style.display = 'none';
            if (resData && resData.data && resData.data.children) {
                currentPostsGlobal = resData.data.children;
                applyProcess(document.getElementById('active-sub-display').textContent.replace('r/', ''));
            }
        };

        function applyProcess(subreddit) {
            let postsToRender = [...currentPostsGlobal];
            calculateStats(postsToRender);
            renderPostsList(postsToRender);
            updateChart(postsToRender);
            generateInsights(subreddit);
        }

        function calculateStats(posts) {
            const total = posts.length;
            let sumUpvotes = 0, sumComments = 0, maxEngagement = 0;
            
            posts.forEach(item => {
                sumUpvotes += item.data.ups || 0;
                sumComments += item.data.num_comments || 0;
                let eng = (item.data.ups || 0) + (item.data.num_comments || 0);
                if (eng > maxEngagement) maxEngagement = eng;
            });
            
            document.getElementById('stat-posts').textContent = total;
            document.getElementById('stat-upvotes').textContent = total > 0 ? Math.round(sumUpvotes / total) : 0;
            document.getElementById('stat-comments').textContent = total > 0 ? Math.round(sumComments / total) : 0;
            document.getElementById('stat-engagement').textContent = maxEngagement;
        }

        function renderPostsList(posts) {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            posts.forEach(item => {
                const p = item.data;
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-title">${p.title}</div>
                    <div class="post-meta">
                        <span>Cluster: <strong>r/${p.subreddit}</strong></span>
                        <span>Upvotes: <strong>${p.ups}</strong></span>
                        <span>Comments: <strong>${p.num_comments}</strong></span>
                    </div>`;
                container.appendChild(card);
            });
        }

        function updateChart(posts) {
            const canvas = document.getElementById('engagementChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const metricsSample = posts.slice(0, 6);
            
            if (chartInstance) chartInstance.destroy();
            
            // Taste Skill Minimalist Curve System - No neon glow slop
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: metricsSample.map((_, i) => `Node 0${i+1}`),
                    datasets: [
                        { 
                            label: 'Velocity Trend', 
                            data: metricsSample.map(p => p.data.ups || 0), 
                            borderColor: '#2f6fed', 
                            backgroundColor: 'transparent', 
                            borderWidth: 2,
                            tension: 0.35,
                            pointRadius: 2,
                            pointBackgroundColor: '#2f6fed',
                            fill: false
                        },
                        { 
                            label: 'Interaction Feedback', 
                            data: metricsSample.map(p => p.data.num_comments || 0), 
                            borderColor: '#905cf2', 
                            backgroundColor: 'transparent', 
                            borderWidth: 1.5,
                            tension: 0.35,
                            pointRadius: 0,
                            fill: false,
                            borderDash: [4, 4]
                        }
                    ]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#62677a', font: { family: 'Geist Mono', size: 10 } } },
                        y: { grid: { color: 'rgba(255,255,255,0.03)', drawTicks: false }, ticks: { color: '#62677a', font: { family: 'Geist Mono', size: 10 } } }
                    }
                }
            });
        }

        function generateInsights(subreddit) {
            const txt = document.getElementById('insight-text');
            txt.textContent = `Strategic telemetry index loaded for r/${subreddit}. Micro-interaction nodes show solid baseline distributions. Layout density verified via Taste Skill core rules.`;
        }

        function handleSearch(event) {
            if (event.key === 'Enter') {
                const query = document.getElementById('search-input').value.trim().toLowerCase();
                if (query) {
                    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                    fetchRedditData(query);
                }
            }
        }

        function changeSubreddit(subName, element) {
            document.getElementById('search-input').value = '';
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            fetchRedditData(subName);
        }

        document.addEventListener('DOMContentLoaded', () => { fetchRedditData('all'); });
    </script>
</body>
</html>
